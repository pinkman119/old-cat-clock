services:
  maomao-postgres:
    image: postgres:16-alpine
    container_name: maomao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maomao
      POSTGRES_PASSWORD: maomao123
      POSTGRES_DB: maomao_clock
    ports:
      - "15432:5432"
    volumes:
      - maomao-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maomao -d maomao_clock"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  maomao-pgdata:
